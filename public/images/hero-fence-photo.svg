<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Hero photo placeholder for Laredo Fence Pros — see IMAGE_PROMPTS.md">
  <defs>
    <linearGradient id="sky-h" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16222c"/>
      <stop offset="0.5" stop-color="#27384a"/>
      <stop offset="1" stop-color="#48596b"/>
    </linearGradient>
    <linearGradient id="ground-h" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23362a"/>
      <stop offset="1" stop-color="#0c1612"/>
    </linearGradient>
    <linearGradient id="post-h" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a3e22"/>
      <stop offset="0.4" stop-color="#9a6c3d"/>
      <stop offset="1" stop-color="#3a2814"/>
    </linearGradient>
    <linearGradient id="warm-h" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d1a466" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f0c987" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#d1a466" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="light-h" cx="0.7" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#f6d8a4" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#d09257" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#0b1320" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Warm afternoon light from upper-right -->
  <rect width="100%" height="100%" fill="url(#sky-h)"/>
  <rect width="100%" height="100%" fill="url(#light-h)"/>

  <!-- Distant Texas horizon -->
  <g fill="#1c2026" opacity="0.75">
    <polygon points="0,640 80,620 160,640 240,610 320,632 400,612 480,640 560,608 640,632 720,610 800,640 880,612 960,640 1040,608 1120,640 1200,610 1280,640 1360,612 1440,640 1520,608 1600,640 1680,612 1760,640 1840,610 1920,640 1920,720 0,720"/>
  </g>

  <!-- Mid-ground brush silhouettes -->
  <g fill="#1a2624" opacity="0.6">
    <ellipse cx="180" cy="680" rx="220" ry="32"/>
    <ellipse cx="640" cy="690" rx="220" ry="26"/>
    <ellipse cx="1280" cy="685" rx="260" ry="28"/>
    <ellipse cx="1780" cy="680" rx="240" ry="34"/>
  </g>

  <!-- Foreground ground/soil -->
  <rect x="0" y="720" width="1920" height="360" fill="url(#ground-h)"/>

  <!-- Fence line (perspective: large in foreground, recede into background) -->
  <g>
    <!-- Top rail (warm-up look) -->
    <line x1="0" y1="640" x2="1920" y2="640" stroke="#251510" stroke-width="6"/>
    <line x1="0" y1="640" x2="1920" y2="640" stroke="url(#warm-h)" stroke-width="3"/>

    <!-- Bottom rail -->
    <line x1="0" y1="836" x2="1920" y2="836" stroke="#1a0e08" stroke-width="5"/>

    <!-- Pickets — many, with perspective: large at left, smaller to right -->
    <g fill="url(#post-h)">
      <!-- Foreground pickets (left side, larger) -->
      <rect x="-50" y="560" width="120" height="290" rx="2"/>
      <rect x="80" y="565" width="100" height="280" rx="2"/>
      <rect x="195" y="572" width="92" height="270" rx="2"/>
      <rect x="302" y="580" width="86" height="258" rx="2"/>
      <rect x="402" y="588" width="80" height="248" rx="2"/>
      <!-- Mid perspective -->
      <rect x="494" y="595" width="74" height="240" rx="2"/>
      <rect x="580" y="600" width="68" height="232" rx="2"/>
      <rect x="660" y="605" width="64" height="226" rx="2"/>
      <rect x="734" y="610" width="60" height="220" rx="2"/>
      <rect x="800" y="615" width="56" height="214" rx="2"/>
      <rect x="864" y="619" width="52" height="208" rx="2"/>
      <rect x="922" y="622" width="48" height="204" rx="2"/>
      <rect x="976" y="625" width="44" height="200" rx="2"/>
      <rect x="1026" y="628" width="40" height="196" rx="2"/>
      <rect x="1072" y="630" width="36" height="192" rx="2"/>
      <rect x="1114" y="632" width="34" height="188" rx="2"/>
      <rect x="1154" y="634" width="32" height="184" rx="2"/>
      <rect x="1192" y="636" width="30" height="180" rx="2"/>
      <rect x="1228" y="637" width="28" height="178" rx="2"/>
      <rect x="1262" y="638" width="26" height="176" rx="2"/>
      <rect x="1294" y="639" width="24" height="174" rx="2"/>
      <rect x="1326" y="640" width="22" height="172" rx="2"/>
      <rect x="1356" y="640" width="20" height="172" rx="2"/>
      <rect x="1384" y="641" width="18" height="170" rx="2"/>
      <rect x="1410" y="641" width="16" height="170" rx="2"/>
      <rect x="1434" y="641" width="14" height="170" rx="2"/>
      <rect x="1456" y="641" width="12" height="170" rx="2"/>
      <rect x="1476" y="641" width="10" height="170" rx="2"/>
      <rect x="1494" y="641" width="8" height="170" rx="2"/>
      <rect x="1510" y="641" width="6" height="170" rx="2"/>
      <rect x="1524" y="641" width="4" height="170" rx="2"/>
      <rect x="1536" y="641" width="2" height="170" rx="2"/>
    </g>
  </g>

  <!-- Subtle vignette + sunset overlay -->
  <rect width="100%" height="100%" fill="url(#light-h)" opacity="0.4"/>

  <!-- Image credit (transparent) -->
  <text x="30" y="1050" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#fcd9a4" opacity="0.5" font-weight="500">Image planned — see IMAGE_PROMPTS.md</text>
</svg>
